services:
  - type: web
    name: agile-sprint-retro-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agile-sprint-retro-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: agile-sprint-retro-db
    plan: free
    databaseName: agile_sprint_retro
    user: agile
